# Render Blueprint for the LUXE backend (Express API).
# Optional shortcut: in Render, "New +" → "Blueprint" → pick this repo and it
# pre-fills the service below. You can also create the service manually using
# the same Root Directory / build / start values (see DEPLOYMENT.md).
services:
  - type: web
    name: luxe-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Paste your MongoDB Atlas connection string (with db name + password):
      - key: MONGO_URI
        sync: false
      # Strong secrets auto-generated by Render — no need to invent your own:
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRE
        value: 15m
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      # Set this to your Vercel URL AFTER the frontend is deployed (no trailing slash):
      - key: FRONTEND_URL
        sync: false
      # Razorpay — leave blank for demo checkout, or paste test/live keys:
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_CURRENCY
        value: INR
      # Optional — only if you use image uploads / transactional email:
      # - key: CLOUDINARY_CLOUD_NAME
      #   sync: false
      # - key: CLOUDINARY_API_KEY
      #   sync: false
      # - key: CLOUDINARY_API_SECRET
      #   sync: false
      # - key: EMAIL_HOST
      #   sync: false
      # - key: EMAIL_PORT
      #   value: "587"
      # - key: EMAIL_USER
      #   sync: false
      # - key: EMAIL_PASS
      #   sync: false
      # - key: EMAIL_FROM
      #   value: LUXE Store <no-reply@luxe.com>
